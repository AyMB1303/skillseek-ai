# Intégration et livraison continues.
#
# La chaîne est organisée en trois étages, du moins cher au plus cher, et
# chacun conditionne le suivant :
#
#   1. qualité      lint + tests unitaires, backend et frontend en parallèle
#   2. images       construction des images Docker (vérifie les Dockerfile)
#   3. publication  envoi vers le registre, uniquement sur `main`
#
# L'ordre n'est pas arbitraire : une faute de style se détecte en trente
# secondes, une image se construit en plusieurs minutes. Faire échouer la
# chaîne le plus tôt possible économise le temps de tout le monde.
#
# Le registre est GHCR (GitHub Container Registry) : il est inclus dans le
# dépôt, ne demande ni compte tiers ni moyen de paiement, et l'authentification
# se fait avec le jeton fourni automatiquement à chaque exécution.

name: CI/CD

on:
  push:
    branches: [main, dev]
    # Les étiquettes de version déclenchent aussi la chaîne : sans cette
    # ligne, poser `v1.0.0` ne construirait rien, et le déploiement qui suit
    # attendrait une image que personne n'a demandée.
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

# Une nouvelle poussée annule l'exécution précédente sur la même branche :
# inutile de tester un commit déjà remplacé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Moindre privilège par défaut : le jeton fourni à chaque exécution ne peut
# que lire le dépôt. Les trois travaux qui ont besoin de davantage — publier
# au registre, alimenter l'onglet Security — le déclarent eux-mêmes.
#
# Sans cette ligne, les travaux héritent du réglage du dépôt, souvent en
# écriture. Un travail de lint n'a aucune raison de pouvoir modifier le code,
# et cette chaîne s'exécute aussi sur des propositions de contribution.
permissions:
  contents: read

env:
  REGISTRE: ghcr.io

jobs:
  # ------------------------------------------------------------------ #
  # 1. Qualité                                                          #
  # ------------------------------------------------------------------ #

  backend:
    name: Backend — lint et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 app tests

      - name: Tests unitaires (pytest)
        # La configuration de test pointe sur SQLite en mémoire : la chaîne
        # n'a besoin d'aucun service PostgreSQL et ne peut donc pas échouer
        # pour une raison d'infrastructure.
        run: pytest -v
        env:
          FLASK_ENV: testing

  frontend:
    name: Frontend — lint et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests unitaires (Vitest)
        working-directory: frontend
        run: npm run test

      - name: Construction de production
        # La construction est la vraie garde du frontend : elle échoue sur une
        # importation absente ou une syntaxe invalide, ce que le lint laisse
        # parfois passer.
        run: npm run build

  dependances:
    name: Dépendances — vulnérabilités connues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Auditer les dépendances Python (pip-audit)
        # Interroge la base d'avis de l'écosystème Python. Non bloquant :
        # une bibliothèque transitive vulnérable sans correctif disponible ne
        # doit pas empêcher de livrer, elle doit être connue.
        #
        # Le code de sortie est absorbé et transformé en avertissement. Sans
        # cela le travail passait au vert tout en affichant deux annotations
        # rouges — un tableau de bord qui se contredit finit par n'être plus
        # lu du tout.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc \
            || echo "::warning title=Dépendances Python::Vulnérabilités connues signalées, voir le journal ci-dessus." 

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Auditer les dépendances Node (npm audit)
        working-directory: frontend
        run: |
          npm audit --audit-level=high \
            || echo "::warning title=Dépendances Node::Vulnérabilités connues signalées, voir le journal ci-dessus." 

  infrastructure:
    name: Infrastructure — validation (Terraform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Ce travail alimente l'onglet Security. Sans cette permission
      # l'analyse est bien calculée, mais l'envoi échoue avec un message
      # d'accès refusé — le constat se perd, et l'analyse ne sert à rien.
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"
          # Le greffon d'enrobage réécrit la sortie des commandes pour la
          # publier en commentaire de proposition de contribution. On ne s'en
          # sert pas ici, et il masque les codes de retour, ce qui est
          # exactement ce qu'on ne veut pas d'une étape de vérification.
          terraform_wrapper: false

      - name: Mise en forme
        # Le formatage d'un fichier d'infrastructure n'est pas cosmétique :
        # une différence d'indentation dans une revue noie le changement
        # réel au milieu du bruit.
        #
        # Signalé et non bloquant pour l'instant. `terraform fmt` aligne les
        # signes d'égalité par groupes d'attributs contigus, une règle que
        # l'on ne devine pas de façon fiable à la main. Après un premier
        # `terraform fmt -recursive` local, retirer la clause `||` pour que
        # l'étape redevienne une vraie garde.
        working-directory: deploiement/terraform
        run: |
          terraform fmt -check -recursive -diff \
            || echo "::warning title=Terraform fmt::Formatage à normaliser : lancez 'terraform fmt -recursive'."

      - name: Initialisation
        # `-backend=false` : la vérification syntaxique n'a pas à joindre
        # Azure ni à lire l'état distant. Elle doit fonctionner sur une
        # proposition de contribution venue d'un dépôt dérivé, qui n'a aucun
        # accès à l'abonnement.
        working-directory: deploiement/terraform
        run: terraform init -backend=false -input=false

      - name: Validation
        working-directory: deploiement/terraform
        run: terraform validate

      - name: Analyse de configuration (Trivy)
        # Cherche les défauts propres à l'infrastructure décrite : port
        # ouvert au-delà du nécessaire, secret en clair, chiffrement absent.
        # Ni flake8 ni ESLint ne lisent du HCL.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploiement
          format: sarif
          output: trivy-infra.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Publier dans l'onglet Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-infra.sarif
          category: trivy-infrastructure

  orchestration:
    name: Orchestration — manifestes Kubernetes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer kubectl
        # Kustomize est intégré à kubectl depuis la version 1.21 : un outil
        # de moins à installer, à épingler et à faire vieillir.
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4

      - name: Assembler les deux environnements
        # Première garde, et la plus utile : une surcharge qui vise un champ
        # inexistant échoue ici, pas au moment du déploiement.
        run: |
          for env in dev prod aks; do
            echo "::group::$env"
            kubectl kustomize "k8s/overlays/$env" > "assemble-$env.yaml"
            grep -c '^kind:' "assemble-$env.yaml" | xargs echo "objets produits :"
            echo "::endgroup::"
          done

      - name: Vérifier les schémas (kubeconform)
        # Contrôle chaque objet contre le schéma officiel de sa version
        # d'API. `-strict` refuse les champs inconnus : une faute de frappe
        # dans un nom de champ est autrement acceptée en silence par le
        # serveur, qui ignore ce qu'il ne comprend pas.
        run: |
          for env in dev prod aks; do
            docker run --rm -v "$PWD:/travail" -w /travail \
              ghcr.io/yannh/kubeconform:v0.6.7 \
              -strict -summary -kubernetes-version 1.31.0 \
              "assemble-$env.yaml"
          done

      - name: Vérifier la configuration (Trivy)
        # Cherche les défauts propres aux manifestes : conteneur en root,
        # limites de ressources absentes, privilèges non abandonnés. C'est
        # ce contrôle qui a dicté les blocs `securityContext` du socle.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: k8s
          format: sarif
          output: trivy-k8s.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Publier dans l'onglet Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-k8s.sarif
          category: trivy-kubernetes

      - name: Monter un cluster éphémère
        # Un vrai serveur d'API, pas une simulation. Les deux étapes
        # précédentes valident la forme ; celle-ci valide l'admission —
        # quotas de nommage, cohérence des sélecteurs, champs immuables,
        # règles de validation propres à la version du serveur.
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: skillseek-validation
          node_image: kindest/node:v1.31.2

      - name: Soumettre les manifestes sans les appliquer
        # `--dry-run=server` envoie réellement les objets au serveur, qui les
        # valide comme s'il allait les créer, puis les jette. C'est la
        # dernière vérification possible sans tirer les images — l'image du
        # service applicatif pèse 3,7 Go, et la faire descendre à chaque
        # exécution coûterait plus qu'elle n'apprendrait ici. L'exécution
        # réelle, elle, est prouvée par le déploiement Azure.
        #
        # L'espace de noms, lui, est créé pour de bon. En simulation le
        # serveur ne l'enregistre pas, et refuse ensuite chacun des objets
        # qui s'y rattachent : « namespaces "skillseek-dev" not found ».
        # La simulation ne peut pas valider un objet dont le contenant
        # n'existe que dans la simulation précédente — c'est une limite du
        # mécanisme, pas un défaut des manifestes.
        run: |
          for env in dev prod aks; do
            echo "::group::$env"
            # L'espace de noms est lu dans la surcharge plutôt que déduit du
            # nom du dossier : les deux coïncidaient jusqu'ici, et une
            # convention qui tient par hasard finit par céder.
            espace=$(awk '/^namespace:/{print $2; exit}' "k8s/overlays/$env/kustomization.yaml")
            kubectl create namespace "$espace" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply --dry-run=server -f "assemble-$env.yaml"
            echo "::endgroup::"
          done

      - name: Conserver les manifestes assemblés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifestes-assembles
          path: assemble-*.yaml
          retention-days: 30

  secrets:
    name: Sécurité — secrets dans l'historique (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Sans cette ligne, l'action ne récupère que le dernier commit, et
          # le scan ne verrait donc que l'état actuel du dépôt — exactement
          # ce que Trivy fait déjà. Tout l'intérêt est ici : relire chaque
          # commit depuis le premier.
          fetch-depth: 0

      - name: Scanner l'historique complet
        # L'image est ancrée sur une version, non sur `latest` : un scan de
        # sécurité dont l'outil change sans prévenir ne permet plus de
        # comparer deux exécutions.
        #
        # `--redact` remplace la valeur trouvée par des astérisques dans le
        # rapport. Un rapport de fuite qui recopie le secret en clair, puis
        # le conserve quatre-vingt-dix jours dans les artefacts d'exécution,
        # est lui-même une fuite.
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --report-format=sarif --report-path=/repo/gitleaks.sarif \
            --redact --exit-code 0 --verbose

      - name: Compter les constats
        # Bloquant, désormais. Le premier passage a servi de base de
        # référence : un seul constat sur tout l'historique, la clé de
        # projet SonarCloud, que la règle générique confond avec une clé
        # d'API. Elle est écartée nommément dans `.gitleaks.toml`.
        #
        # La base étant à zéro, tout nouveau constat désigne un secret
        # introduit par le changement en cours — et un secret publié dans un
        # dépôt public doit arrêter la chaîne, pas produire un
        # avertissement de plus dans une liste que personne ne relit.
        if: always()
        run: |
          n=$(python3 -c "import json; print(len(json.load(open('gitleaks.sarif'))['runs'][0]['results']))" 2>/dev/null || echo 0)
          echo "### Secrets dans l'historique : $n constat(s)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then
            echo "::error title=Gitleaks::$n constat(s) dans l'historique Git — voir l'onglet Security."
            exit 1
          fi

      - name: Publier dans l'onglet Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  securite:
    name: Sécurité — analyse du dépôt (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Analyser le système de fichiers
        # L'action est ancrée sur l'empreinte du commit, pas sur une branche.
        # `@master` — la référence donnée par la documentation de Trivy —
        # exécuterait dans cette chaîne le contenu que le mainteneur y pousse,
        # quel qu'il soit et quand il veut. Une empreinte ne bouge pas ; c'est
        # le seul ancrage qui donne une garantie sur ce qui tourne.
        # Dependabot proposera les montées de version.
        #
        # Cherche les dépendances vulnérables ET les secrets écrits en dur.
        # Le second point compte autant que le premier : une clé oubliée dans
        # un fichier de configuration est la faille la plus banale qui soit.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          format: sarif
          output: trivy-depot.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Publier dans l'onglet Security
        # Le format SARIF alimente l'onglet « Security » du dépôt : les
        # résultats sont datés, dédoublonnés et suivis dans le temps, au lieu
        # d'être noyés dans un journal d'exécution.
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-depot.sarif
          category: trivy-depot

  sast:
    name: Sécurité — analyse du code (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les analyseurs
        run: pip install bandit bandit-sarif-formatter semgrep

      # Bandit lit l'arbre syntaxique du code Python et cherche des motifs
      # dangereux : hachage affaibli, construction de requete par concatenation,
      # ouverture d'URL a schema libre, secret ecrit en dur. C'est ce que ni
      # flake8 ni ESLint ne font — ils jugent le style, pas la surete.
      - name: Bandit — analyse du service applicatif
        # Bloquant, et volontairement. La base a ete assainie : douze constats
        # releves, cinq corriges, sept justifies par une annotation `nosec`
        # portant son motif. L'analyseur rend donc zero, et tout nouveau
        # constat de gravite moyenne ou superieure signale une regression
        # introduite par le changement en cours.
        run: bandit -r backend/app -ll

      - name: Bandit — rapport pour l'onglet Security
        if: always()
        run: bandit -r backend/app -f sarif -o bandit.sarif --exit-zero

      - name: Publier Bandit
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

      # Semgrep couvre les deux ecosystemes, la ou Bandit ne voit que Python.
      - name: Semgrep — Python et JavaScript
        # Informatif, et non bloquant. Les regles proviennent d'un depot public
        # qui evolue independamment de ce projet : une regle ajoutee en amont
        # ferait echouer une construction sans aucun rapport avec le code
        # livre ce jour-la. Les constats remontent dans l'onglet Security, ou
        # ils sont dates et suivis, ce qui est le bon endroit pour un signal
        # qui appelle un jugement plutot qu'un blocage.
        continue-on-error: true
        run: |
          semgrep --config=p/python --config=p/javascript \
            --metrics=off --sarif --output=semgrep.sarif \
            backend/app frontend/src

      - name: Publier Semgrep
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ------------------------------------------------------------------ #
  # 2. Images                                                           #
  # ------------------------------------------------------------------ #

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend, dependances, securite, sast, secrets, infrastructure, orchestration]
    permissions:
      contents: read
      packages: write
      # Ce travail analyse les images construites et publie le resultat dans
      # l'onglet Security, comme les deux travaux de securite. Sans cette
      # permission l'analyse est bien calculee mais l'envoi echoue, et le
      # constat se perd dans le journal d'execution — l'analyse ne sert alors
      # a rien.
      security-events: write
    strategy:
      # Les deux images se construisent en parallèle et l'échec de l'une
      # n'interrompt pas l'autre : on veut connaître les deux résultats.
      fail-fast: false
      matrix:
        include:
          - service: backend
            contexte: ./backend
          - service: frontend
            contexte: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: S'authentifier au registre
        # Uniquement lorsqu'on publie : une pull request venue d'un fork n'a
        # pas les droits d'écriture, et la construction seule suffit à valider.
        #
        # Les étiquettes de version publient aussi : sans cela, poser `v1.0.0`
        # produirait un déploiement pointant sur une image inexistante.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRE }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes et métadonnées
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRE }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            # Poser une étiquette `v1.2.0` sur un commit produit les images
            # correspondantes : c'est ce qui rend une version déployée
            # identifiable autrement que par une empreinte de commit.
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - name: Construire l'image pour inspection
        # Construction locale d'abord : Trivy et Syft ont besoin d'une image
        # présente dans le démon Docker pour l'ouvrir. Ni inventaire ni
        # attestation à cette étape — l'exportateur `docker` ne sait pas les
        # écrire, et les demander ici faisait échouer la construction.
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          load: true
          push: false
          tags: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache porté par la chaîne elle-même : sans lui, l'image backend
          # réinstallerait PyTorch et les modèles linguistiques à chaque
          # exécution, soit plus de dix minutes.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Analyser l'image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          # Seul le niveau critique fait échouer la chaîne. Une image de base
          # accumule toujours quelques failles de niveau haut sans correctif
          # amont : bloquer dessus reviendrait à ne plus jamais livrer, et
          # donc à désapprendre à regarder les alertes.
          exit-code: "0"
          ignore-unfixed: true

      - name: Publier dans l'onglet Security
        # Non bloquant : l'envoi vers le service d'analyse de code exige
        # GitHub Advanced Security sur un dépôt privé. Là où il n'est pas
        # disponible, le rapport reste lisible dans le journal du travail et
        # la chaîne ne doit pas s'arrêter pour autant.
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

      - name: Produire l'inventaire logiciel (SBOM)
        # Liste exacte des composants présents dans l'image. C'est ce qui
        # permet de répondre en quelques secondes à « sommes-nous exposés à
        # cette faille ? » au lieu de reconstruire pour aller voir.
        uses: anchore/sbom-action@v0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}.spdx.json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Conserver l'inventaire
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 90

      - name: Publier au registre
        # Seconde passe, réservée à `main` et aux étiquettes de version. Tout
        # est en cache : elle ne reconstruit rien, elle pousse. C'est ici que
        # l'inventaire et l'attestation d'origine sont attachés à l'image,
        # l'exportateur du registre sachant les porter.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          sbom: true
          provenance: mode=max

  # ------------------------------------------------------------------ #
  # 3. Vérification d'assemblage                                        #
  # ------------------------------------------------------------------ #

  assemblage:
    name: Démarrage de la pile complète
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Réservé aux poussées sur `main`. L'image backend embarque PyTorch, le
    # modèle linguistique de spaCy et celui des plongements : sa construction
    # dépasse la dizaine de minutes. La jouer à chaque commit de branche
    # coûterait plus qu'elle ne rapporte, les tests unitaires couvrant déjà
    # la logique.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Le dépôt contient un `docker-compose.override.yml` destiné au poste de
    # développement — frontend en rechargement à chaud, backend en mode debug.
    # Compose le charge automatiquement, ce qui reviendrait ici à vérifier
    # l'environnement de développement au lieu de celui de production, soit
    # l'exact contraire de l'objet de ce travail.
    #
    # La variable est posée au niveau du travail plutôt que par un `-f` répété
    # sur chaque appel : un drapeau se perd le jour où une étape est ajoutée,
    # et l'oubli serait silencieux.
    env:
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      - name: Fichier d'environnement
        # Valeurs de test : aucun secret réel ne transite par la chaîne.
        run: cp .env.example .env

      - name: Lever la pile
        run: docker compose up -d --build

      - name: Attendre que l'API réponde
        # La sonde de vie du conteneur est déjà déclarée dans le compose ;
        # on l'interroge ici depuis l'extérieur, comme le ferait un client.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health; then
              echo "API opérationnelle"; exit 0
            fi
            sleep 10
          done
          echo "L'API n'a pas répondu dans le délai imparti"
          docker compose logs backend
          exit 1

      - name: Appliquer les migrations
        run: docker compose exec -T backend flask db upgrade

      # ---------------------------------------------------------------- #
      # Analyse dynamique                                                 #
      # ---------------------------------------------------------------- #
      #
      # Les analyseurs précédents lisent le code sans jamais l'exécuter :
      # ils reconnaissent des motifs réputés dangereux. Celui-ci fait
      # l'inverse — il ignore le code et attaque l'application en marche,
      # comme le ferait quelqu'un depuis l'extérieur. Les deux approches ne
      # trouvent pas les mêmes choses : un en-tête de sécurité absent, une
      # page d'erreur trop bavarde ou un cookie sans attribut ne se voient
      # que sur un service qui répond.
      #
      # Ce travail est le seul de la chaîne où la pile complète tourne :
      # c'est donc le seul endroit où ce contrôle est possible sans
      # dépenser dix minutes de construction supplémentaires.

      - name: Préparer le répertoire de rapport
        # Le conteneur d'analyse n'écrit pas sous l'identité du runner ;
        # sans droits d'écriture ouverts sur le point de montage, il produit
        # son rapport puis échoue à l'enregistrer.
        run: |
          mkdir -p rapport-zap && chmod 777 rapport-zap
          cp .zap/regles.tsv rapport-zap/regles.tsv

      - name: Récupérer l'analyseur dynamique
        # Étape distincte, et c'est délibéré. L'étape suivante absorbe le
        # code de retour de l'analyse, puisqu'un constat ne doit pas
        # interrompre la chaîne. Si la récupération de l'image était dans la
        # même étape, une étiquette erronée produirait un échec instantané
        # que cette absorption transformerait en simple avertissement : la
        # chaîne resterait verte en annonçant une analyse qui n'a jamais eu
        # lieu. C'est exactement ce qui s'est produit au premier essai.
        run: docker pull zaproxy/zap-stable:2.17.0

      - name: Analyse dynamique de l'interface (OWASP ZAP)
        # `--network host` donne au conteneur d'analyse l'accès aux ports
        # publiés par la pile ; sans cela il tourne dans son propre réseau et
        # ne joint rien.
        #
        # `-I` : les alertes de niveau avertissement ne font pas échouer le
        # travail. Seul un constat classé en échec dans le fichier de règles
        # arrête la chaîne. C'est le même principe que pour Trivy — on
        # bloque sur ce qu'on a décidé de bloquer, pas sur ce que l'outil
        # décide ce matin-là.
        run: |
          docker run --rm --network host \
            -v "$PWD/rapport-zap:/zap/wrk/:rw" \
            zaproxy/zap-stable:2.17.0 \
            zap-baseline.py -t http://localhost:3000 \
              -c regles.tsv -r rapport-zap.html -w rapport-zap.md -I \
            || echo "::warning title=ZAP::Constats relevés par l'analyse dynamique, voir l'artefact."

      - name: Vérifier que l'analyse a bien eu lieu
        # Seconde garde contre le même piège : un rapport absent signifie
        # que l'analyseur n'a pas tourné, ce qui est un échec de la chaîne
        # et non un résultat.
        run: |
          if [ ! -s rapport-zap/rapport-zap.md ]; then
            echo "::error title=ZAP::Aucun rapport produit — l'analyseur n'a pas pu s'exécuter."
            ls -la rapport-zap/
            exit 1
          fi

      - name: Résumé de l'analyse dynamique
        if: always()
        # Le rapport commence par des statistiques de parcours, et ne donne
        # le nom des alertes qu'ensuite. Couper trop tôt affichait le compte
        # — « une alerte élevée » — sans jamais dire laquelle, ce qui est le
        # seul renseignement utile. On garde donc tout le tableau.
        run: |
          if [ -f rapport-zap/rapport-zap.md ]; then
            {
              echo "## Analyse dynamique (OWASP ZAP)"
              echo ""
              head -120 rapport-zap/rapport-zap.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Conserver le rapport d'analyse dynamique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-zap
          path: rapport-zap/
          retention-days: 30

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêter la pile
        if: always()
        run: docker compose down -v
