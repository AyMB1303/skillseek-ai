# Déploiement sur Azure Container Instances.
#
# ⚠ INACTIF TANT QUE LE SECRET `AZURE_CREDENTIALS` N'EST PAS RENSEIGNÉ.
#
# Pourquoi des conteneurs et non une machine virtuelle : l'abonnement
# académique utilisé n'accorde aucun quota de processeurs sur les familles de
# machines proposées dans les régions que sa politique autorise. Le service
# Container Instances relève d'un quota distinct, lui disponible. Le projet
# étant déjà conteneurisé, c'est une transposition et non un contournement.
#
# Pour l'activer :
#
#   az ad sp create-for-rbac --name skillseek-deploy \
#     --role Contributor --scopes /subscriptions/<abonnement> --json-auth
#
# puis coller le bloc JSON obtenu dans Settings → Secrets and variables →
# Actions → `AZURE_CREDENTIALS`.

name: Déploiement

on:
  # Déclenchement manuel : on choisit la version à mettre en ligne. C'est ce
  # qui rend le retour arrière trivial — remettre en ligne une étiquette
  # précédente est exactement la même opération qu'un déploiement.
  workflow_dispatch:
    inputs:
      etiquette:
        description: "Étiquette d'image (latest, v1.0.0, sha-abc1234)"
        required: true
        default: latest

  # Automatique dès qu'une version est étiquetée. La chaîne d'intégration
  # publie les images portant cette même étiquette : le déploiement suit donc
  # une version identifiable, et non un état mouvant de la branche.
  push:
    tags: ["v*"]

concurrency:
  # Deux déploiements simultanés sur le même groupe de conteneurs se
  # marcheraient dessus. Le second attend plutôt que d'écraser.
  group: deploiement-azure
  cancel-in-progress: false

env:
  GROUPE: SkillSeek-demo
  REGION: germanywestcentral
  NOM: skillseek

jobs:
  deployer:
    name: Déployer ${{ inputs.etiquette || github.ref_name }}
    runs-on: ubuntu-latest
    environment: demonstration
    permissions:
      contents: read

    steps:
      - name: Vérifier que la cible est configurée
        # Sans cette garde, le job échouerait plus loin sur une erreur
        # d'authentification illisible. Mieux vaut dire tout de suite ce qui
        # manque.
        env:
          ACCES: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$ACCES" ]; then
            echo "::error::Aucun accès Azure configuré. Renseignez le secret"
            echo "::error::AZURE_CREDENTIALS (voir l'en-tête de ce fichier)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: S'authentifier auprès d'Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Groupe de ressources
        # Idempotent : la commande réussit que le groupe existe ou non.
        run: az group create --name "$GROUPE" --location "$REGION" --output none

      - name: Attendre que l'image soit publiée
        # Poser une étiquette déclenche DEUX workflows simultanément : celui
        # qui construit et publie les images, et celui-ci. Rien ne les
        # ordonne, et le déploiement gagnerait la course — pour échouer sur
        # une image qui n'existe pas encore.
        #
        # L'interrogation porte sur le registre lui-même plutôt que sur
        # l'état de l'autre workflow : ce qui compte n'est pas qu'une
        # construction se soit terminée, c'est que l'artefact soit là.
        env:
          DEPOT: aymb1303/skillseek-ai
          ETIQUETTE: ${{ inputs.etiquette || github.ref_name }}
        #
        # Trente minutes de patience : le travail de construction des images
        # n'attaque le backend qu'après les cinq travaux de vérification, et
        # cette image pèse 3,7 Go. Vingt minutes se sont révélées trop justes
        # à l'usage.
        run: |
          for _ in $(seq 1 90); do
            if docker manifest inspect "ghcr.io/${DEPOT}/backend:${ETIQUETTE}" >/dev/null 2>&1; then
              echo "Image backend:${ETIQUETTE} disponible au registre."
              exit 0
            fi
            echo "En attente de backend:${ETIQUETTE}…"
            sleep 20
          done
          echo "::error::L'image backend:${ETIQUETTE} n'a pas été publiée dans le délai imparti."
          echo "::error::Vérifiez que la chaîne d'intégration a réussi et que le paquet est public."
          exit 1

      - name: Libérer le groupe précédent
        # Un groupe de conteneurs ne se met pas à jour en place : le recréer
        # est la seule opération fiable. La suppression est tolérante à
        # l'absence, ce qui rend le workflow rejouable autant de fois que
        # nécessaire.
        run: az container delete -g "$GROUPE" -n "$NOM" --yes --output none 2>/dev/null || true

      - name: Déployer le groupe de conteneurs
        env:
          ETIQUETTE: ${{ inputs.etiquette || github.ref_name }}
          DEPOT: aymb1303/skillseek-ai
        run: bash deploiement/aci/deployer.sh

      - name: Relever l'adresse publique
        id: adresse
        run: |
          fqdn=$(az container show -g "$GROUPE" -n "$NOM" --query ipAddress.fqdn -o tsv)
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          {
            echo "## Déploiement"
            echo ""
            echo "**Adresse :** http://$fqdn"
            echo ""
            echo "**Version :** \`${{ inputs.etiquette || github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier que le service répond
        # Le contrôle est fait depuis l'extérieur, comme le ferait un client.
        # Le délai est long : au premier démarrage le service applique les
        # migrations et charge le jeu de démonstration avant de répondre.
        run: |
          for _ in $(seq 1 40); do
            if curl -fsS "http://${{ steps.adresse.outputs.fqdn }}/api/ready"; then
              echo ""
              echo "Déploiement vérifié"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Le service n'a pas répondu dans le délai imparti."
          az container logs -g "$GROUPE" -n "$NOM" --container-name backend
          exit 1

      - name: Journaux en cas d'échec
        if: failure()
        run: |
          az container show -g "$GROUPE" -n "$NOM" \
            --query "containers[].{conteneur:name, etat:instanceView.currentState.state}" -o table || true
          az container logs -g "$GROUPE" -n "$NOM" --container-name proxy || true
          az container logs -g "$GROUPE" -n "$NOM" --container-name db || true
