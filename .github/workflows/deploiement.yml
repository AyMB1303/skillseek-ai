# Déploiement sur un serveur Linux.
#
# ⚠ INACTIF TANT QUE LES SECRETS NE SONT PAS RENSEIGNÉS.
#
# Ce fichier décrit un déploiement réel, pas une maquette : il se connecte en
# SSH, récupère les images depuis le registre, applique les migrations et
# vérifie que le service répond. Mais il ne peut rien faire sans serveur, et
# il refuse de s'exécuter à vide plutôt que de faire semblant de réussir.
#
# Pour l'activer, définir dans Settings → Secrets and variables → Actions :
#
#   SSH_HOTE          adresse du serveur
#   SSH_UTILISATEUR   compte de déploiement (pas root)
#   SSH_CLE_PRIVEE    clé privée, sans phrase de passe
#   CHEMIN_DEPLOIEMENT  répertoire contenant .env et docker-compose.prod.yml
#
# Le serveur doit disposer de Docker, et le compte de déploiement doit
# appartenir au groupe `docker`.

name: Déploiement

on:
  # Déclenchement manuel : on choisit la version à mettre en ligne. C'est ce
  # qui rend le retour arrière possible — remettre en ligne une étiquette
  # précédente est exactement la même opération qu'un déploiement.
  workflow_dispatch:
    inputs:
      version:
        description: "Étiquette d'image (v1.2.0, ou empreinte de commit)"
        required: true
        default: latest
      environnement:
        description: "Cible"
        required: true
        default: staging
        type: choice
        options: [staging, production]

  # Automatique vers la pré-production dès qu'une version est étiquetée.
  push:
    tags: ["v*"]

jobs:
  deployer:
    name: Déployer ${{ inputs.version || github.ref_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environnement || 'staging' }}
    steps:
      - name: Vérifier que la cible est configurée
        # Sans cette garde, le job échouerait plus loin sur une erreur SSH
        # incompréhensible. Mieux vaut dire tout de suite ce qui manque.
        run: |
          if [ -z "${{ secrets.SSH_HOTE }}" ]; then
            echo "::error::Aucun serveur configuré. Renseignez les secrets SSH_* "
            echo "::error::(voir l'en-tête de ce fichier et docs/DEVOPS.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Installer la clé de déploiement
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_CLE_PRIVEE }}

      - name: Déployer
        env:
          HOTE: ${{ secrets.SSH_HOTE }}
          UTILISATEUR: ${{ secrets.SSH_UTILISATEUR }}
          CHEMIN: ${{ secrets.CHEMIN_DEPLOIEMENT }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$UTILISATEUR@$HOTE" bash -s <<EOF
          set -euo pipefail
          cd "$CHEMIN"

          # La version précédente est notée AVANT de basculer : c'est elle
          # qu'on remettra en ligne si la nouvelle ne répond pas.
          echo "\$(grep '^IMAGE_TAG=' .env || echo IMAGE_TAG=latest)" > .version-precedente
          cat .version-precedente

          sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$VERSION|" .env || echo "IMAGE_TAG=$VERSION" >> .env

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d

          # Les migrations passent APRÈS le démarrage du conteneur mais avant
          # la vérification : une migration qui échoue doit faire échouer le
          # déploiement, pas laisser une application sur un schéma incohérent.
          docker compose -f docker-compose.prod.yml exec -T backend flask db upgrade
          EOF

      - name: Vérifier que le service répond
        env:
          HOTE: ${{ secrets.SSH_HOTE }}
          UTILISATEUR: ${{ secrets.SSH_UTILISATEUR }}
          CHEMIN: ${{ secrets.CHEMIN_DEPLOIEMENT }}
        run: |
          ssh "$UTILISATEUR@$HOTE" bash -s <<'EOF'
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/api/ready; then
              echo "Déploiement vérifié"; exit 0
            fi
            sleep 6
          done
          echo "Le service ne répond pas après déploiement"
          exit 1
          EOF

      - name: Revenir à la version précédente
        # Le retour arrière est automatique et n'exige aucune décision
        # humaine dans l'urgence : les images précédentes sont toujours dans
        # le registre, remettre l'étiquette suffit.
        if: failure()
        env:
          HOTE: ${{ secrets.SSH_HOTE }}
          UTILISATEUR: ${{ secrets.SSH_UTILISATEUR }}
          CHEMIN: ${{ secrets.CHEMIN_DEPLOIEMENT }}
        run: |
          ssh "$UTILISATEUR@$HOTE" bash -s <<'EOF'
          set -euo pipefail
          cd "$CHEMIN"
          if [ -f .version-precedente ]; then
            PRECEDENTE=$(cut -d= -f2 .version-precedente)
            echo "Retour arrière vers $PRECEDENTE"
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$PRECEDENTE|" .env
            docker compose -f docker-compose.prod.yml up -d
          fi
          EOF
