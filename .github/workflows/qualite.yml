# Analyse de qualité SonarCloud.
#
# Séparée de la chaîne d'intégration pour une raison simple : elle dépend d'un
# service extérieur et d'un jeton. Une indisponibilité de SonarCloud ne doit
# pas empêcher de construire, de tester ni de publier.
#
# Ce que cette analyse ajoute aux quatre analyseurs de sécurité déjà en place :
# une mesure de la **couverture de tests**, la détection de **duplication**,
# et une note de maintenabilité. Ce ne sont pas des questions de sûreté, mais
# de coût d'évolution — ce qu'il en coûtera de reprendre ce code plus tard.
#
# Requiert le secret `SONAR_TOKEN` (Settings → Secrets and variables → Actions).

name: Qualité

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Vérifier que le jeton est configuré
        env:
          JETON: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$JETON" ]; then
            echo "::error::Secret SONAR_TOKEN absent. Voir l'en-tête de ce fichier."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Historique complet : SonarCloud attribue chaque constat à son
          # auteur et distingue le code neuf de l'ancien. Avec un clone
          # superficiel, tout le dépôt paraîtrait écrit au dernier commit.
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Tests avec mesure de couverture
        working-directory: backend
        env:
          FLASK_ENV: testing
        run: pytest --cov=app --cov-report=xml --cov-report=term -q

      - name: Analyser
        # Ancrée sur l'empreinte du commit et non sur une étiquette mobile,
        # pour la même raison que l'action Trivy : une action exécute du code
        # dans cette chaîne, avec accès au jeton.
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # L'action vise une instance SonarQube par défaut ; cette variable
          # la dirige vers le service hébergé SonarCloud.
          SONAR_HOST_URL: https://sonarcloud.io
