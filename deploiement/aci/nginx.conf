# Reverse proxy pour un groupe de conteneurs Azure Container Instances.
#
# Difference unique mais decisive avec `deploiement/nginx.conf` : dans un
# groupe ACI, tous les conteneurs partagent la MEME pile reseau. Il n'y a pas
# de resolution par nom de service — `backend` ou `frontend` ne designent
# rien. Les voisins se joignent sur `127.0.0.1`, comme s'ils tournaient dans
# le meme systeme.
#
# C'est aussi pourquoi un seul port est publie pour le groupe entier : les
# quatre conteneurs se partagent l'espace de ports, et deux d'entre eux ne
# peuvent pas ecouter sur le meme numero.

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
