[defaults]
inventory = inventaire.ini
host_key_checking = False
# Les machines viennent d'être créées : leur empreinte d'hôte est inconnue,
# et la vérification interactive bloquerait un playbook non surveillé. Le
# risque est accepté sur des machines éphémères dont on connaît l'adresse
# par la sortie de Terraform.

stdout_callback = default
# Le greffon « yaml » de la collection community.general a été retiré en
# version 12 : il est remplacé depuis ansible-core 2.13 par une option du
# greffon par défaut. Le nommer fait échouer le playbook avant sa première
# tâche — et l'erreur ne dit pas qu'il s'agit d'un réglage d'affichage,
# sans rapport avec ce qu'on installe.
#
# On s'en tient au greffon par défaut : une dépendance de moins, et rien
# qui puisse disparaître d'une version à l'autre.

retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# Une connexion réutilisée pour toutes les tâches d'un même hôte, au lieu
# d'une par tâche. Sur un playbook d'une vingtaine d'étapes, la différence
# se compte en minutes.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
