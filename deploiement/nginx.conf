# Reverse proxy de production.
#
# Il resout un probleme precis. Next.js fige les variables NEXT_PUBLIC_* au
# moment de la CONSTRUCTION de l'image, pas au demarrage : l'adresse de l'API
# est donc gravee dans le paquet JavaScript envoye au navigateur. Une image
# construite avec `http://localhost:5000/api` ferait appeler au visiteur SA
# PROPRE machine, ou rien ne repond.
#
# Publier l'interface et l'API derriere la meme adresse leve la contrainte :
# le frontend appelle `/api`, un chemin relatif, valable quelle que soit
# l'adresse du serveur. L'image devient portable, et le meme artefact tourne
# sur n'importe quel hote sans reconstruction — ce qui est precisement ce que
# la chaine d'integration promet.
#
# Effet de bord bienvenu : interface et API partagent l'origine, donc la
# question du partage entre origines (CORS) ne se pose plus du tout.

server {
    listen 80;
    server_name _;

    # Les CV deposes sont des PDF, parfois scannes. La limite par defaut de
    # nginx est de 1 Mo : un scan couleur la depasse sans difficulte, et le
    # refus arriverait sous la forme d'une erreur 413 illisible pour le
    # candidat.
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # L'analyse d'un CV enchaine extraction, reconnaissance optique
        # eventuelle, plongements semantiques et prediction. Le delai par
        # defaut de 60 s serait atteint sur un document scanne volumineux.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js emploie des connexions persistantes ; sans ces trois
        # lignes, la navigation fonctionne mais le rechargement a chaud et
        # les evenements serveur restent muets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
