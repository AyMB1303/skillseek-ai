<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0B1220;font-family:'Inter',sans-serif;color:#E5EAF3;}
  a{color:#3B82F6;text-decoration:none;} a:hover{color:#22D3EE;}
  *{box-sizing:border-box;}
</style>
</helmet>
<div style="display:flex; min-height:100vh; background:#0B1220;" data-screen-label="Candidat — Mes candidatures">
  <aside style="width:248px; flex-shrink:0; background:#0D1526; border-right:1px solid #1E2A44; display:flex; flex-direction:column; padding:20px 14px; gap:6px; position:sticky; top:0; height:100vh;">
    <div style="display:flex; align-items:center; gap:10px; padding:6px 10px 22px 10px;">
      <div style="width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#3B82F6,#22D3EE); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1220" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"></circle><line x1="15" y1="15" x2="20" y2="20"></line></svg>
      </div>
      <span style="font-weight:700; font-size:16px; letter-spacing:-0.2px; white-space:nowrap;">SkillSeek <span style="color:#22D3EE;">AI</span></span>
    </div>
    <nav style="display:flex; flex-direction:column; gap:4px;">
      <a href="Candidat Offres.dc.html" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; color:#8B98B8; font-weight:500; font-size:14px; text-decoration:none;" style-hover="background:#111A2E; color:#E5EAF3;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        <span>Offres d'emploi</span>
      </a>
      <div style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:rgba(59,130,246,0.14); color:#E5EAF3; font-weight:600; font-size:14px; border:1px solid rgba(59,130,246,0.25); cursor:pointer;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"><path d="M14 3v5h5"></path><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><line x1="9" y1="13" x2="15" y2="13"></line></svg>
        <span>Mes candidatures</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; color:#8B98B8; font-weight:500; font-size:14px; cursor:pointer;" style-hover="background:#111A2E; color:#E5EAF3;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"></path></svg>
        <span>Mon profil</span>
      </div>
    </nav>
    <div style="margin-top:auto; border-top:1px solid #1E2A44; padding-top:14px; display:flex; align-items:center; gap:10px; padding-left:6px;">
      <div style="width:34px; height:34px; border-radius:99px; background:#1E2A44; color:#22D3EE; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;">AT</div>
      <div style="min-width:0;"><div style="font-size:13px; font-weight:600; white-space:nowrap;">Amine Tahiri</div><div style="font-size:11.5px; color:#8B98B8; white-space:nowrap;">Candidat</div></div>
    </div>
  </aside>

  <div style="flex:1; min-width:0; display:flex; flex-direction:column;">
    <header style="display:flex; align-items:center; gap:20px; padding:16px 32px; border-bottom:1px solid #1E2A44; background:rgba(11,18,32,0.85); backdrop-filter:blur(8px); position:sticky; top:0; z-index:10;">
      <div>
        <h1 style="margin:0; font-size:19px; font-weight:600; letter-spacing:-0.2px;">Mes candidatures</h1>
        <div style="font-size:12.5px; color:#8B98B8; margin-top:1px;">Suivez l'avancement de vos candidatures</div>
      </div>
      <a href="Mon Profil.dc.html" style="display:flex; align-items:center; gap:9px; cursor:pointer; padding:5px 8px 5px 5px; border-radius:10px; margin-left:auto; text-decoration:none;" style-hover="background:#111A2E;">
        <div style="width:32px; height:32px; border-radius:99px; background:linear-gradient(135deg,#3B82F6,#22D3EE); color:#0B1220; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">AT</div>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8B98B8" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
      </a>
    </header>

    <main style="padding:26px 32px 48px; display:flex; flex-direction:column; gap:16px; max-width:960px;">
      <sc-for list="{{ candidatures }}" as="c" hint-placeholder-count="4">
        <div style="background:#111A2E; border:1px solid #1E2A44; border-radius:14px; padding:22px 24px; display:flex; flex-direction:column; gap:20px;">
          <!-- entête carte -->
          <div style="display:flex; align-items:flex-start; gap:14px;">
            <div style="width:44px; height:44px; border-radius:10px; background:{{ c.logoBg }}; color:#0B1220; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; flex-shrink:0;">{{ c.logoTxt }}</div>
            <div style="flex:1; min-width:0;">
              <div style="font-size:15.5px; font-weight:600; letter-spacing:-0.2px;">{{ c.poste }}</div>
              <div style="font-size:12.5px; color:#8B98B8; margin-top:3px;">{{ c.entreprise }} · Candidature envoyée le {{ c.date }}</div>
            </div>
            <span style="{{ c.badgeStyle }}">{{ c.badgeTxt }}</span>
          </div>

          <!-- stepper -->
          <div style="display:flex; align-items:flex-start; padding:0 4px;">
            <sc-for list="{{ c.etapes }}" as="e" hint-placeholder-count="4">
              <div style="display:flex; align-items:center; {{ e.flex }}">
                <div style="display:flex; flex-direction:column; align-items:center; gap:8px; flex-shrink:0;">
                  <div style="{{ e.puceStyle }}">
                    <sc-if value="{{ e.fait }}" hint-placeholder-val="{{ true }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0B1220" stroke-width="3" stroke-linecap="round"><path d="M20 6L9 17l-5-5"></path></svg></sc-if>
                  </div>
                  <span style="{{ e.labelStyle }}">{{ e.label }}</span>
                </div>
                <sc-if value="{{ e.montrerLigne }}" hint-placeholder-val="{{ true }}">
                  <div style="{{ e.ligneStyle }}"></div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const NOMS = ['Reçue', 'En cours d\'étude', 'Entretien', 'Décision'];
    const data = [
      { poste:'Développeur Python Senior', entreprise:'Yellow Tech', date:'12 juil. 2026', logoTxt:'YT', logoBg:'#3B82F6', etape:2, resultat:null },
      { poste:'Développeur Full-Stack React', entreprise:'Atlas Digital', date:'8 juil. 2026', logoTxt:'AD', logoBg:'#22D3EE', etape:3, resultat:'accepte' },
      { poste:'Ingénieur DevOps', entreprise:'CloudMaroc', date:'2 juil. 2026', logoTxt:'CM', logoBg:'#34D399', etape:1, resultat:null },
      { poste:'Data Scientist', entreprise:'InsightLab', date:'25 juin 2026', logoTxt:'IL', logoBg:'#F59E0B', etape:3, resultat:'refuse' },
    ];

    const badge = (c) => {
      if (c.resultat === 'accepte') return { badgeTxt:'Acceptée', badgeStyle:'flex-shrink:0; display:inline-flex; align-items:center; gap:6px; background:rgba(52,211,153,0.12); color:#34D399; border:1px solid rgba(52,211,153,0.3); border-radius:99px; padding:4px 12px; font-size:12px; font-weight:600;' };
      if (c.resultat === 'refuse') return { badgeTxt:'Non retenue', badgeStyle:'flex-shrink:0; display:inline-flex; align-items:center; gap:6px; background:rgba(139,152,184,0.1); color:#8B98B8; border:1px solid rgba(139,152,184,0.25); border-radius:99px; padding:4px 12px; font-size:12px; font-weight:600;' };
      return { badgeTxt:'En cours', badgeStyle:'flex-shrink:0; display:inline-flex; align-items:center; gap:6px; background:rgba(34,211,238,0.1); color:#22D3EE; border:1px solid rgba(34,211,238,0.3); border-radius:99px; padding:4px 12px; font-size:12px; font-weight:600;' };
    };

    const candidatures = data.map(c => {
      const finalOK = c.resultat === 'accepte';
      const finalKO = c.resultat === 'refuse';
      const etapes = NOMS.map((label, i) => {
        const dernier = i === 3;
        const fait = i < c.etape || (dernier && (finalOK || finalKO)) || i === c.etape;
        const atteint = i <= c.etape;
        // couleur puce
        let bg = '#1E2A44', border = '#2c3d63', labelColor = '#8B98B8';
        if (dernier && finalOK) { bg = '#34D399'; border = '#34D399'; labelColor = '#34D399'; }
        else if (dernier && finalKO) { bg = '#3d485f'; border = '#3d485f'; labelColor = '#8B98B8'; }
        else if (i < c.etape) { bg = '#3B82F6'; border = '#3B82F6'; labelColor = '#E5EAF3'; }
        else if (i === c.etape) { bg = '#22D3EE'; border = '#22D3EE'; labelColor = '#22D3EE'; }
        const estFait = (i < c.etape) || (dernier && finalOK);
        const ligneActive = i < c.etape;
        return {
          label,
          fait: estFait,
          flex: dernier ? '' : 'flex:1;',
          puceStyle: 'width:28px; height:28px; border-radius:99px; background:' + bg + '; border:2px solid ' + border + '; display:flex; align-items:center; justify-content:center;' + (i === c.etape && !dernier ? ' box-shadow:0 0 0 4px rgba(34,211,238,0.15);' : ''),
          labelStyle: 'font-size:11.5px; font-weight:' + (i === c.etape || (dernier && finalOK) ? '600' : '500') + '; color:' + labelColor + '; white-space:nowrap;',
          montrerLigne: !dernier,
          ligneStyle: 'flex:1; height:2px; margin:13px 6px 0; background:' + (ligneActive ? '#3B82F6' : '#1E2A44') + ';',
        };
      });
      return { ...c, ...badge(c), etapes };
    });

    return { candidatures };
  }
}
</script>
</body>
</html>
