<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0B1220;font-family:'Inter',sans-serif;color:#E5EAF3;}
  a{color:#3B82F6;text-decoration:none;} a:hover{color:#22D3EE;}
  *{box-sizing:border-box;}
  ::placeholder{color:#8B98B8;opacity:.7;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</helmet>
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; background:radial-gradient(1100px 600px at 20% 0%, rgba(59,130,246,0.12), transparent 60%), radial-gradient(900px 500px at 90% 100%, rgba(34,211,238,0.1), transparent 55%), #0B1220;" data-screen-label="Connexion">
  <div style="width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; gap:22px;">
    <!-- logo -->
    <div style="display:flex; align-items:center; gap:11px;">
      <div style="width:40px; height:40px; border-radius:11px; background:linear-gradient(135deg,#3B82F6,#22D3EE); display:flex; align-items:center; justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0B1220" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"></circle><line x1="15" y1="15" x2="20" y2="20"></line></svg>
      </div>
      <span style="font-weight:700; font-size:20px; letter-spacing:-0.3px;">SkillSeek <span style="color:#22D3EE;">AI</span></span>
    </div>

    <!-- carte -->
    <div style="width:100%; background:#111A2E; border:1px solid #1E2A44; border-radius:16px; padding:32px 30px; box-shadow:0 24px 60px rgba(0,0,0,0.35);">
      <h1 style="margin:0 0 6px; font-size:22px; font-weight:700; letter-spacing:-0.3px;">Bon retour 👋</h1>
      <p style="margin:0 0 22px; font-size:13.5px; color:#8B98B8;">Connectez-vous à votre espace de recrutement.</p>

      <!-- bandeau mdp oublié -->
      <sc-if value="{{ resetEnvoye }}" hint-placeholder-val="{{ false }}">
        <div style="background:rgba(34,211,238,0.08); border:1px solid rgba(34,211,238,0.3); border-radius:10px; padding:11px 14px; display:flex; align-items:flex-start; gap:10px; margin-bottom:18px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" style="flex-shrink:0; margin-top:1px;"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
          <span style="font-size:12.5px; color:#E5EAF3; line-height:1.5;">Si un compte existe, un lien de réinitialisation vient d'être envoyé à votre adresse email.</span>
        </div>
      </sc-if>

      <!-- bandeau erreur -->
      <sc-if value="{{ erreur }}" hint-placeholder-val="{{ false }}">
        <div style="background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.35); border-radius:10px; padding:11px 14px; display:flex; align-items:center; gap:10px; margin-bottom:18px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F87171" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="13"></line><line x1="12" y1="16" x2="12" y2="16.1"></line></svg>
          <span style="font-size:12.5px; color:#E5EAF3;">Identifiants invalides. Vérifiez votre email et votre mot de passe.</span>
        </div>
      </sc-if>

      <div style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <label style="display:block; font-size:12.5px; color:#8B98B8; margin-bottom:7px; font-weight:500;">Email</label>
          <input type="email" placeholder="prenom.nom@entreprise.ma" style="width:100%; background:#0D1526; border:1px solid #1E2A44; border-radius:10px; padding:12px 14px; color:#E5EAF3; font-family:'Inter',sans-serif; font-size:14px; outline:none;" style-focus="border-color:#3B82F6;">
        </div>
        <div>
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:7px;">
            <label style="font-size:12.5px; color:#8B98B8; font-weight:500;">Mot de passe</label>
            <a href="#" onClick="{{ motOublie }}" style="font-size:12px;">Mot de passe oublié ?</a>
          </div>
          <div style="position:relative;">
            <input type="{{ typeMdp }}" value="{{ mdpVal }}" onInput="{{ onMdp }}" style="width:100%; background:#0D1526; border:1px solid #1E2A44; border-radius:10px; padding:12px 44px 12px 14px; color:#E5EAF3; font-family:'Inter',sans-serif; font-size:14px; outline:none;" style-focus="border-color:#3B82F6;">
            <button onClick="{{ toggleMdp }}" style="position:absolute; right:6px; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:8px; border:none; background:transparent; color:#8B98B8; cursor:pointer; display:flex; align-items:center; justify-content:center;" style-hover="color:#E5EAF3;">
              <sc-if value="{{ mdpVisible }}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
              <sc-if value="{{ mdpMasque }}" hint-placeholder-val="{{ true }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5.1-5.9M9.9 4.2A10.6 10.6 0 0 1 12 4c6.5 0 10 7 10 7a18.4 18.4 0 0 1-2.2 3.2M1 1l22 22"></path></svg></sc-if>
            </button>
          </div>
        </div>
        <button onClick="{{ connexion }}" style="width:100%; margin-top:4px; height:46px; background:#3B82F6; color:#fff; border:none; border-radius:10px; font-family:'Inter',sans-serif; font-size:14.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px;" style-hover="background:#2f6fdb;">
          <sc-if value="{{ chargement }}" hint-placeholder-val="{{ false }}"><span style="width:17px; height:17px; border:2.4px solid rgba(255,255,255,0.35); border-top-color:#fff; border-radius:99px; animation:spin .7s linear infinite; display:block;"></span></sc-if>
          {{ texteBouton }}
        </button>
      </div>
    </div>

    <div style="font-size:13px; color:#8B98B8;">Pas encore de compte ? <a href="Inscription.dc.html" style="font-weight:600;">Créer un compte</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:760}}">
class Component extends DCLogic {
  state = { visible:false, chargement:false, erreur:false, mdp:'MotDePasse123', reset:false };
  renderVals() {
    return {
      typeMdp: this.state.visible ? 'text' : 'password',
      mdpVisible: this.state.visible,
      mdpMasque: !this.state.visible,
      mdpVal: this.state.mdp,
      onMdp: (e) => this.setState({ mdp: e.target.value }),
      toggleMdp: (e) => { e.preventDefault(); this.setState({ visible: !this.state.visible }); },
      motOublie: (e) => { e.preventDefault(); this.setState({ reset:true, erreur:false }); },
      resetEnvoye: this.state.reset,
      chargement: this.state.chargement,
      erreur: this.state.erreur,
      texteBouton: this.state.chargement ? 'Connexion…' : 'Se connecter',
      connexion: () => {
        this.setState({ chargement:true, erreur:false, reset:false });
        setTimeout(() => this.setState({ chargement:false, erreur:true }), 1400);
      },
    };
  }
}
</script>
</body>
</html>
