<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0B1220;font-family:'Inter',sans-serif;color:#E5EAF3;}
  a{color:#3B82F6;text-decoration:none;} a:hover{color:#22D3EE;}
  *{box-sizing:border-box;}
  ::placeholder{color:#8B98B8;opacity:.7;}
</style>
</helmet>
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; background:radial-gradient(1100px 600px at 80% 0%, rgba(34,211,238,0.12), transparent 60%), radial-gradient(900px 500px at 10% 100%, rgba(59,130,246,0.1), transparent 55%), #0B1220;" data-screen-label="Inscription">
  <div style="width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center; gap:22px;">
    <div style="display:flex; align-items:center; gap:11px;">
      <div style="width:40px; height:40px; border-radius:11px; background:linear-gradient(135deg,#3B82F6,#22D3EE); display:flex; align-items:center; justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0B1220" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"></circle><line x1="15" y1="15" x2="20" y2="20"></line></svg>
      </div>
      <span style="font-weight:700; font-size:20px; letter-spacing:-0.3px;">SkillSeek <span style="color:#22D3EE;">AI</span></span>
    </div>

    <div style="width:100%; background:#111A2E; border:1px solid #1E2A44; border-radius:16px; padding:32px 30px; box-shadow:0 24px 60px rgba(0,0,0,0.35);">
      <h1 style="margin:0 0 6px; font-size:22px; font-weight:700; letter-spacing:-0.3px;">Créer un compte</h1>
      <p style="margin:0 0 22px; font-size:13.5px; color:#8B98B8;">Rejoignez SkillSeek AI et trouvez votre prochain poste.</p>

      <div style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <label style="display:block; font-size:12.5px; color:#8B98B8; margin-bottom:7px; font-weight:500;">Nom complet</label>
          <input type="text" placeholder="ex. Amine Tahiri" style="width:100%; background:#0D1526; border:1px solid #1E2A44; border-radius:10px; padding:12px 14px; color:#E5EAF3; font-family:'Inter',sans-serif; font-size:14px; outline:none;" style-focus="border-color:#3B82F6;">
        </div>
        <div>
          <label style="display:block; font-size:12.5px; color:#8B98B8; margin-bottom:7px; font-weight:500;">Email</label>
          <input type="email" placeholder="amine.tahiri@gmail.com" style="width:100%; background:#0D1526; border:1px solid #1E2A44; border-radius:10px; padding:12px 14px; color:#E5EAF3; font-family:'Inter',sans-serif; font-size:14px; outline:none;" style-focus="border-color:#3B82F6;">
        </div>
        <div>
          <label style="display:block; font-size:12.5px; color:#8B98B8; margin-bottom:7px; font-weight:500;">Mot de passe</label>
          <input type="text" value="{{ motDePasse }}" onInput="{{ onMotDePasse }}" placeholder="Créez un mot de passe fort" style="width:100%; background:#0D1526; border:1px solid #1E2A44; border-radius:10px; padding:12px 14px; color:#E5EAF3; font-family:'Inter',sans-serif; font-size:14px; outline:none;" style-focus="border-color:#3B82F6;">
          <div style="display:flex; gap:5px; margin-top:10px;">
            <div style="{{ barre1 }}"></div><div style="{{ barre2 }}"></div><div style="{{ barre3 }}"></div><div style="{{ barre4 }}"></div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;">
            <sc-for list="{{ criteres }}" as="c" hint-placeholder-count="4">
              <div style="display:flex; align-items:center; gap:7px; font-size:12px; color:{{ c.couleur }};">
                <span style="{{ c.puce }}">
                  <sc-if value="{{ c.ok }}" hint-placeholder-val="{{ false }}"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#0B1220" stroke-width="3.5" stroke-linecap="round"><path d="M20 6L9 17l-5-5"></path></svg></sc-if>
                </span>{{ c.label }}
              </div>
            </sc-for>
          </div>
        </div>
        <div>
          <label style="display:block; font-size:12.5px; color:#8B98B8; margin-bottom:7px; font-weight:500;">Confirmer le mot de passe</label>
          <input type="password" placeholder="••••••••" style="width:100%; background:#0D1526; border:1px solid #1E2A44; border-radius:10px; padding:12px 14px; color:#E5EAF3; font-family:'Inter',sans-serif; font-size:14px; outline:none;" style-focus="border-color:#3B82F6;">
        </div>

        <div style="display:flex; gap:10px; align-items:flex-start; background:#0D1526; border:1px solid #1E2A44; border-radius:10px; padding:12px 14px;">
          <div onClick="{{ toggleConsent }}" style="{{ caseStyle }}">
            <sc-if value="{{ consent }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0B1220" stroke-width="3" stroke-linecap="round"><path d="M20 6L9 17l-5-5"></path></svg></sc-if>
          </div>
          <span style="font-size:11.5px; color:#8B98B8; line-height:1.55;">En créant un compte, vous consentez à l'analyse automatisée de votre CV par notre IA. <a href="#">En savoir plus</a></span>
        </div>

        <button style="width:100%; margin-top:2px; height:46px; background:#3B82F6; color:#fff; border:none; border-radius:10px; font-family:'Inter',sans-serif; font-size:14.5px; font-weight:600; cursor:pointer;" style-hover="background:#2f6fdb;">Créer mon compte</button>
      </div>
    </div>

    <div style="font-size:13px; color:#8B98B8;">Déjà inscrit ? <a href="Connexion.dc.html" style="font-weight:600;">Se connecter</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:860}}">
class Component extends DCLogic {
  state = { mdp:'Amine2026', consent:true };
  renderVals() {
    const p = this.state.mdp || '';
    const crits = [
      { label:'8 caractères min.', ok: p.length >= 8 },
      { label:'Une majuscule', ok: /[A-Z]/.test(p) },
      { label:'Une minuscule', ok: /[a-z]/.test(p) },
      { label:'Un chiffre', ok: /[0-9]/.test(p) },
    ];
    const score = crits.filter(c => c.ok).length;
    const barre = (i) => {
      const on = score >= i;
      const coul = score <= 1 ? '#F87171' : score === 2 ? '#F59E0B' : score === 3 ? '#22D3EE' : '#34D399';
      return 'flex:1; height:5px; border-radius:99px; background:' + (on ? coul : '#1E2A44') + '; transition:background 150ms;';
    };
    const critStyle = (ok) => ({
      couleur: ok ? '#34D399' : '#8B98B8',
      puce: 'width:15px; height:15px; border-radius:99px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:' + (ok ? '#34D399' : '#26324c') + ';',
    });
    return {
      motDePasse: this.state.mdp,
      onMotDePasse: (e) => this.setState({ mdp: e.target.value }),
      criteres: crits.map(c => ({ ...c, ...critStyle(c.ok) })),
      barre1: barre(1), barre2: barre(2), barre3: barre(3), barre4: barre(4),
      consent: this.state.consent,
      toggleConsent: () => this.setState({ consent: !this.state.consent }),
      caseStyle: 'width:20px; height:20px; border-radius:6px; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 150ms; background:' + (this.state.consent ? '#3B82F6' : 'transparent') + '; border:1.5px solid ' + (this.state.consent ? '#3B82F6' : '#2c3d63') + ';',
    };
  }
}
</script>
</body>
</html>
