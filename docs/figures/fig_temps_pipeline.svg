<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="600" viewBox="0 0 1340 600">
  <rect width="1340" height="600" fill="#FFFFFF"/>
  <text x="50" y="54" font-family="Helvetica" font-size="19" font-weight="bold" fill="#12324F">Où passe le temps dans la chaîne d'intégration</text>
  <text x="50" y="82" font-family="Helvetica" font-size="12.5" fill="#5B6B7B">Durées mesurées sur l'exécution n&#186; 59 — les travaux s'exécutent en parallèle.</text>

  <text x="414" y="138" text-anchor="end" font-family="Helvetica"
        font-size="13" fill="#12324F">Backend — lint et 194 tests</text>
  <rect x="430" y="116" width="427" height="32" rx="5" fill="#D7E5F2"
        stroke="#1F4E79" stroke-width="3"/>
  <text x="869" y="138" font-family="Helvetica"
        font-size="12.5" font-weight="bold"
        fill="#12324F">4 min 08 s</text>
  <text x="442" y="137" font-family="Helvetica" font-size="12" font-weight="bold" fill="#12324F">chemin critique</text>

  <text x="414" y="190" text-anchor="end" font-family="Helvetica"
        font-size="13" fill="#12324F">Démarrage de la pile complète</text>
  <rect x="430" y="168" width="268" height="32" rx="5" fill="#C9E4E2"
        stroke="#17706E" stroke-width="1.8"/>
  <text x="710" y="190" font-family="Helvetica"
        font-size="12.5" font-weight="bold"
        fill="#12324F">2 min 36 s</text>

  <text x="414" y="242" text-anchor="end" font-family="Helvetica"
        font-size="13" fill="#12324F">Frontend — lint et construction</text>
  <rect x="430" y="220" width="86" height="32" rx="5" fill="#D7E5F2"
        stroke="#1F4E79" stroke-width="1.8"/>
  <text x="528" y="242" font-family="Helvetica"
        font-size="12.5" font-weight="bold"
        fill="#12324F">0 min 50 s</text>

  <text x="414" y="294" text-anchor="end" font-family="Helvetica"
        font-size="13" fill="#12324F">Dépendances — vulnérabilités</text>
  <rect x="430" y="272" width="71" height="32" rx="5" fill="#F7E3B8"
        stroke="#9C6404" stroke-width="1.8"/>
  <text x="513" y="294" font-family="Helvetica"
        font-size="12.5" font-weight="bold"
        fill="#12324F">0 min 41 s</text>

  <text x="414" y="346" text-anchor="end" font-family="Helvetica"
        font-size="13" fill="#12324F">Sécurité — analyse du code</text>
  <rect x="430" y="324" width="71" height="32" rx="5" fill="#F3D6D2"
        stroke="#9B2F2F" stroke-width="1.8"/>
  <text x="513" y="346" font-family="Helvetica"
        font-size="12.5" font-weight="bold"
        fill="#12324F">0 min 41 s</text>

  <text x="414" y="398" text-anchor="end" font-family="Helvetica"
        font-size="13" fill="#12324F">Sécurité — analyse du dépôt</text>
  <rect x="430" y="376" width="34" height="32" rx="5" fill="#F3D6D2"
        stroke="#9B2F2F" stroke-width="1.8"/>
  <text x="476" y="398" font-family="Helvetica"
        font-size="12.5" font-weight="bold"
        fill="#12324F">0 min 20 s</text>

  <line x1="430" y1="440" x2="857" y2="440"
        stroke="#12324F" stroke-width="2.5"/>
  <text x="430" y="466" font-family="Helvetica" font-size="12"
        fill="#12324F">0</text>
  <text x="857" y="466" text-anchor="end"
        font-family="Helvetica" font-size="12" fill="#12324F">4 min 08 s</text>
  <rect x="50" y="492" width="1240" height="72" rx="10" fill="#E8ECF0"
        stroke="#5B6B7B" stroke-width="1.5"/>
  <text x="70" y="520" font-family="Helvetica" font-size="13" font-weight="bold"
        fill="#12324F">Ce que la mesure apprend</text>
  <text x="70" y="544" font-family="Helvetica" font-size="12.5" fill="#12324F">Les tests du service applicatif portent à eux seuls le chemin critique : les cinq autres travaux se terminent avant eux.</text>
  <text x="70" y="562" font-family="Helvetica" font-size="12.5" fill="#12324F">Raccourcir la boucle de retour passerait donc par la parallélisation des tests, non par l'optimisation des analyses de sûreté.</text>
</svg>