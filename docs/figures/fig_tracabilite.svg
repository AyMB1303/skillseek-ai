<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <rect width="1400" height="620" fill="#FFFFFF"/>
  <text x="60" y="62" font-family="Helvetica" font-size="20" font-weight="bold" fill="#12324F">Traçabilité : du commit au service qui répond</text>
  <text x="60" y="92" font-family="Helvetica" font-size="13" fill="#5B6B7B">Le même artefact progresse d'un bout à l'autre. Aucune étape ne reconstruit ce que la précédente a produit.</text>

  <rect x="60" y="150" width="290" height="230" rx="12" fill="#D7E5F2"
        stroke="#1F4E79" stroke-width="3"/>
  <circle cx="94" cy="186" r="19" fill="#1F4E79"/>
  <text x="94" y="192" text-anchor="middle" font-family="Helvetica"
        font-size="16" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="126" y="193" font-family="Helvetica" font-size="17"
        font-weight="bold" fill="#12324F">Commit</text>
  <rect x="80" y="224" width="250" height="40" rx="6"
        fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="205.0" y="250" text-anchor="middle"
        font-family="monospace" font-size="15" fill="#12324F">4d7328a</text>
  <text x="205.0" y="292" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#12324F">empreinte SHA-1</text>
  <text x="205.0" y="313" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#12324F">du contenu du dépôt</text>
  <line x1="354" y1="265.0" x2="379" y2="265.0" stroke="#5B6B7B" stroke-width="3"/><polygon points="391,265.0 377,258.0 377,272.0" fill="#5B6B7B"/>

  <rect x="395" y="150" width="290" height="230" rx="12" fill="#C9E4E2"
        stroke="#17706E" stroke-width="3"/>
  <circle cx="429" cy="186" r="19" fill="#17706E"/>
  <text x="429" y="192" text-anchor="middle" font-family="Helvetica"
        font-size="16" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="461" y="193" font-family="Helvetica" font-size="17"
        font-weight="bold" fill="#12324F">Image</text>
  <rect x="415" y="224" width="250" height="40" rx="6"
        fill="#FFFFFF" stroke="#17706E" stroke-width="1.5"/>
  <text x="540.0" y="250" text-anchor="middle"
        font-family="monospace" font-size="15" fill="#12324F">ghcr.io/…:4d7328a</text>
  <text x="540.0" y="292" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#12324F">construite une seule fois,</text>
  <text x="540.0" y="313" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#12324F">étiquetée par l'empreinte</text>
  <line x1="689" y1="265.0" x2="714" y2="265.0" stroke="#5B6B7B" stroke-width="3"/><polygon points="726,265.0 712,258.0 712,272.0" fill="#5B6B7B"/>

  <rect x="730" y="150" width="290" height="230" rx="12" fill="#F7E3B8"
        stroke="#9C6404" stroke-width="3"/>
  <circle cx="764" cy="186" r="19" fill="#9C6404"/>
  <text x="764" y="192" text-anchor="middle" font-family="Helvetica"
        font-size="16" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="796" y="193" font-family="Helvetica" font-size="17"
        font-weight="bold" fill="#12324F">Version</text>
  <rect x="750" y="224" width="250" height="40" rx="6"
        fill="#FFFFFF" stroke="#9C6404" stroke-width="1.5"/>
  <text x="875.0" y="250" text-anchor="middle"
        font-family="monospace" font-size="15" fill="#12324F">v1.0.0</text>
  <text x="875.0" y="292" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#12324F">la même image reçoit</text>
  <text x="875.0" y="313" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#12324F">une étiquette lisible</text>
  <line x1="1024" y1="265.0" x2="1049" y2="265.0" stroke="#5B6B7B" stroke-width="3"/><polygon points="1061,265.0 1047,258.0 1047,272.0" fill="#5B6B7B"/>

  <rect x="1065" y="150" width="290" height="230" rx="12" fill="#CDE6D8"
        stroke="#1F6B4A" stroke-width="3"/>
  <circle cx="1099" cy="186" r="19" fill="#1F6B4A"/>
  <text x="1099" y="192" text-anchor="middle" font-family="Helvetica"
        font-size="16" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="1131" y="193" font-family="Helvetica" font-size="17"
        font-weight="bold" fill="#12324F">Exécution</text>
  <rect x="1085" y="224" width="250" height="40" rx="6"
        fill="#FFFFFF" stroke="#1F6B4A" stroke-width="1.5"/>
  <text x="1210.0" y="250" text-anchor="middle"
        font-family="monospace" font-size="15" fill="#12324F">groupe de conteneurs</text>
  <text x="1210.0" y="292" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#12324F">l'artefact est tiré,</text>
  <text x="1210.0" y="313" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#12324F">jamais reconstruit</text>

  <rect x="60" y="428" width="1280" height="76" rx="12" fill="#FFFFFF"
        stroke="#1F6B4A" stroke-width="3"/>
  <text x="86" y="458" font-family="Helvetica" font-size="15"
        font-weight="bold" fill="#12324F">Contrôle de sortie</text>
  <text x="86" y="484" font-family="Helvetica" font-size="13"
        fill="#12324F">La chaîne interroge <tspan font-family="monospace">/api/ready</tspan> depuis l'extérieur du réseau. L'exécution n'est déclarée réussie que si le service répond — non parce qu'une commande a rendu la main.</text>
  <text x="60" y="548" font-family="Helvetica" font-size="12.5"
        fill="#5B6B7B">Conséquence pratique : à tout instant, l'empreinte affichée par le registre désigne le commit exact qui tourne. Le chemin se refait dans les deux sens.</text>
</svg>