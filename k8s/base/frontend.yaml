# Interface.
#
# Sans état : deux répliques par défaut, ce qui permet une mise à jour
# progressive sans coupure — Kubernetes retire une réplique de la rotation,
# la remplace, puis passe à la suivante.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: skillseek
    app.kubernetes.io/component: interface
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: skillseek
      app.kubernetes.io/component: interface
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillseek
        app.kubernetes.io/component: interface
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: frontend
          image: ghcr.io/aymb1303/skillseek-ai/frontend:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: skillseek
    app.kubernetes.io/component: interface
  ports:
    - name: http
      port: 3000
      targetPort: http
