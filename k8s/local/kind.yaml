# Cluster local jetable.
#
# `kind` fait tourner un cluster Kubernetes dans des conteneurs Docker. Ce
# n'est pas un cluster de production — un seul nœud, aucune tolérance à la
# panne, pas de stockage réseau — mais il exécute le même serveur d'API, le
# même ordonnanceur et le même gestionnaire de contrôleurs. Ce qui s'y
# déploie s'y déploie vraiment.
#
#   kind create cluster --config k8s/local/kind.yaml
#
# Deux réglages, et aucun n'est cosmétique.
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: skillseek

nodes:
  - role: control-plane
    # Sans cette étiquette, le contrôleur d'entrée refuse de se placer : son
    # manifeste exige un nœud qui la porte, ce qui désigne d'ordinaire les
    # nœuds de bordure d'un vrai cluster. Sur un cluster à un nœud, c'est
    # celui-là.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

    # Le cluster tourne dans un conteneur : ses ports ne sont pas ceux de la
    # machine. Sans cette correspondance, l'adresse publiée par le contrôleur
    # d'entrée n'est joignable que depuis l'intérieur du cluster, et le
    # navigateur ne voit rien.
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
