# Environnement de développement.
#
# Une seule réplique d'interface, des ressources réduites, et des secrets de
# démonstration générés sur place : cet environnement n'a jamais vu de
# données réelles et n'est pas destiné à en voir.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillseek-dev

resources:
  - ../../base
  - espace-de-noms.yaml

# Les valeurs ci-dessous ne sont pas des secrets : ce sont des chaînes
# publiques, écrites en clair et assumées comme telles, pour un
# environnement jetable. La production, elle, ne génère rien — voir la
# surcharge correspondante.
secretGenerator:
  - name: skillseek-secrets
    literals:
      - POSTGRES_PASSWORD=developpement-jetable
      - DATABASE_URL=postgresql://skillseek:developpement-jetable@db:5432/skillseek
      - SECRET_KEY=cle-de-developpement-sans-valeur
      - JWT_SECRET_KEY=cle-jwt-de-developpement-sans-valeur

# Sans cette option, kustomize ajoute au nom du secret une empreinte de son
# contenu. C'est un mécanisme utile — modifier un secret relance
# automatiquement les pods qui l'utilisent — mais il impose que le secret
# soit généré, ce que la production ne fait pas. On garde donc le même nom
# partout, et le redémarrage se demande explicitement.
generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: ConfigMap
      name: skillseek-config
    patch: |-
      - op: replace
        path: /data/FRONTEND_ORIGIN
        value: http://dev.skillseek.local
      - op: replace
        path: /data/FLASK_ENV
        value: development
  - target:
      kind: Ingress
      name: skillseek
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.skillseek.local
