apiVersion: v1
kind: Namespace
metadata:
  name: skillseek-local
  labels:
    kubernetes.io/metadata.name: skillseek-local
    environnement: local
---
# Mise à l'échelle automatique.
#
# Conservée sur un cluster à un nœud, et ce n'est pas décoratif : c'est le
# seul dispositif du socle qu'on ne peut pas juger sur lecture. Une réplique
# au repos, deux au plus — le service applicatif réserve un cœur, et il faut
# que la seconde réplique puisse effectivement se placer, sans quoi la
# démonstration montrerait une mise à l'échelle déclenchée mais bloquée, ce
# qui est pire que de ne rien montrer.
#
# La montée n'est observable que si le serveur de métriques est installé :
# `kind` ne le fournit pas, contrairement à un cluster infogéré.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
