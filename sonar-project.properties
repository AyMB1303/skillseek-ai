# Configuration de l'analyse SonarCloud.
#
# Ce fichier accompagne le workflow `.github/workflows/qualite.yml`. Il décrit
# ce qu'il faut analyser, ce qu'il faut ignorer, et où trouver la couverture
# de tests — trois questions qu'un analyseur ne peut pas deviner seul.

sonar.projectKey=AyMB1303_skillseek-ai
sonar.organization=aymb1303
sonar.projectName=SkillSeek AI

# Code source réellement écrit pour ce projet.
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests

# Exclusions, et leurs motifs.
#
#   migrations/   fichiers engendrés par Alembic ; leur style n'est pas un
#                 choix du projet et leur duplication est structurelle
#   .next/        artefacts de construction de Next.js
#   node_modules/ dépendances tierces
sonar.exclusions=**/migrations/**,**/.next/**,**/node_modules/**,**/__pycache__/**

# La couverture est mesurée sur le service applicatif. Le chemin est réécrit
# parce que `coverage` note les fichiers relativement au dossier `backend`,
# alors que Sonar raisonne depuis la racine du dépôt.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.12

# Les fichiers de test ne sont pas soumis à la détection de duplication : deux
# cas de test qui se ressemblent, c'est normal et souvent souhaitable — la
# lisibilité d'un test prime sur sa factorisation.
sonar.cpd.exclusions=backend/tests/**

sonar.sourceEncoding=UTF-8
